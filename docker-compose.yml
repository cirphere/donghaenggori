# 동행고리 AI — 배포용 구성
#
#   docker compose up -d --build       # 기동 (첫 회는 모델 다운로드로 오래 걸린다)
#   docker compose logs -f             # 진행 확인
#   curl -X POST localhost:8000/api/warmup   # 시연 전 반드시
#
# 배포 대상이 미정이라 아키텍처를 고정하지 않았다. 배포할 머신에서 빌드하면
# amd64(AWS)든 arm64(Oracle)든 그대로 만들어진다.

services:
  app:
    build: .
    image: donghaenggori:latest
    restart: unless-stopped
    ports:
      # 호스트 루프백에만 연다. 0.0.0.0 으로 열면 같은 공유기의 다른 기기가
      # 8000 에 직접 붙을 수 있고, 그 요청에는 Cloudflare 헤더가 없어
      # /api/reset 의 '외부 차단'을 우회한다(데이터 전체 삭제 가능).
      # 프론트(nginx)는 이 포트가 아니라 도커 네트워크로 app:8000 에 붙으므로
      # 여기를 좁혀도 영향이 없다.
      - "127.0.0.1:8000:8000"
    # 키는 .env.app 에만 둔다. 이 파일에 적지 않는다.
    #
    # 루트 .env 도 함께 읽는다 — 예전 배포본이 한 파일에 전부 넣고 있어서,
    # 옮기기 전에도 그대로 뜨게 하려는 것이다. 나중 파일이 이긴다.
    # 둘 다 required: false 라 없어도 기동은 된다(키가 없으면 폴백이 돈다).
    env_file:
      - path: .env
        required: false
      - path: .env.app
        required: false
    environment:
      # WHISPER_* 와 STT_MAX_SECONDS 는 여기 두지 않는다. environment 가
      # env_file 을 이기기 때문에, 여기 적으면 .env.app 으로 못 바꾼다.
      # 배포 기본값은 .env.app.example 에 적어뒀다(base/cpu/2스레드).
      # GPU 오버레이의 environment 는 여전히 이긴다 — 의도한 대로다.
      # 기동 직후 예열한다 — 모델 로드와 외부 API 캐시.
      #
      # 사람이 curl 로 부르는 것을 잊으면 시연 첫 요청이 30초 넘게 걸린다.
      # 기동을 막지 않으므로(별도 스레드) 헬스체크는 그대로 통과한다.
      # 로컬 실행·테스트에서는 매번 모델을 받지 않도록 코드 기본값이 꺼져 있다.
      WARMUP_ON_START: "1"
      HF_HOME: /models/hf
      DONGHAENGGORI_DB: /data/donghaenggori.db
    volumes:
      # 모델 캐시 1.5GB — 첫 기동 때 받고 이후 재사용한다
      - hf-cache:/models/hf
      # SQLite — 컨테이너를 지워도 접수·감사로그가 남는다
      - db-data:/data
      # 학습 산출물(BERT 423MB)은 저장소에 없다. 호스트에 있으면 쓰고,
      # 없으면 TF-IDF → 규칙으로 자동 폴백한다(/api/status 로 확인).
      - ./donghaenggori/data/models:/app/donghaenggori/data/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 첫 기동은 모델 다운로드가 있어 오래 걸린다 — 그동안 unhealthy로 보지 않는다
      start_period: 900s
    # 4GiB 장비에서 폭주로 호스트를 끌고 죽지 않게 상한을 둔다.
    # 실측 최대 2.2GB(5분 음성) 기준으로 여유를 잡았다.
    deploy:
      resources:
        limits:
          memory: 3g

volumes:
  hf-cache:
  db-data:
