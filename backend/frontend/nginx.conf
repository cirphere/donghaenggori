# 프론트 정적 서빙 + 백엔드 리버스 프록시
#
# 프론트와 API를 **같은 오리진**으로 묶는다. 이렇게 하면
#   · CORS 가 필요 없다 (같은 출처)
#   · Cloudflare Access 를 이 호스트명 하나에만 걸면 API 까지 함께 보호된다
#     (오리진이 같아 로그인 쿠키가 API 요청에도 자동으로 실린다)
#   · 터널 Public Hostname 이 하나로 끝난다
#
# 백엔드는 별도 컨테이너 그대로다. 라우팅만 여기서 한다.

# ── 호스트별 분리 ────────────────────────────────────────────────────
#
# 터널에 Public Hostname 을 둘 만들면(guardian.* / staff.*) 같은 nginx 로
# 들어오되 화면이 갈린다. 보호자에게 준 링크로 직원 화면에 닿지 못한다.
#
# **서버 블록을 복제하지 않는다.** 같은 location 을 세 벌 쓰면 한쪽만 고치는
# 사고가 난다. 호스트를 변수로 뽑아 필요한 곳에서만 막는다.
#
# 도메인을 박지 않고 접두어로 판별한다 — 도메인이 바뀌어도 그대로 동작하고,
# 지금처럼 호스트를 하나만 쓰는 동안에는 **둘 다 0 이라 아무것도 안 바뀐다.**
# 즉 Cloudflare 에 호스트를 추가하기 전에는 배포가 지금과 완전히 같다.
map $host $is_guardian_host {
    default            0;
    "~^guardian\."     1;
}
map $host $is_staff_host {
    default            0;
    "~^staff\."        1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # **기본 인증을 서버 전체에 걸지 않는다.**
    #
    # 예전에는 여기에 include 를 걸어 전부 막고, 열어야 하는 곳마다 `auth_basic off`
    # 로 구멍을 냈다. 백엔드에 인증이 없던 시절엔 그게 유일한 방어선이었다.
    # 지금은 API 가 토큰으로 스스로를 지킨다 — 실측으로 확인했다:
    #
    #   기본 인증을 끈 상태에서 /api/dashboard·/api/intakes·/api/audit·/api/status
    #   ·/api/reset 전부 401. 무인증인 보호자 접수도 응답에 프로필·이력이 없다.
    #
    # 그래서 전체를 막는 방식은 얻는 것보다 잃는 게 컸다. 공개해야 할 경로가
    # 생길 때마다 예외를 뚫어야 하는데, 실제로 그걸 빠뜨려서 **보호자 접수가
    # 배포에서 통째로 동작하지 않았다**(백엔드까지 닿지도 못했다).
    #
    # 이제는 **토큰이 못 지키는 것에만** 건다 — /docs·/dev 두 곳뿐이다(아래).
    # 그 둘은 API 가 아니라 정적 문서·개발 화면이라 401 이 붙지 않는다.

    # 음성 업로드가 있으므로 넉넉히. 5분 음성이 수 MB 수준이다.
    client_max_body_size 64m;

    # 도커 내장 DNS. 변수로 넘겨 요청마다 해석하게 한다 —
    # 그러지 않으면 app 컨테이너가 재시작될 때 nginx 가 옛 IP 를 붙들고
    # 502 를 낸다(기동 시 1회만 해석하기 때문).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ClawOps 웹훅 — 통신사는 로그인 화면을 통과하지 못한다. 인증에서 빼되
    # 여기는 **웹훅 서명(HMAC-SHA256)** 이 지킨다. 서명이 없거나 틀리면 401,
    # 키가 미설정이면 503 이다(tests/test_voice.py 가 회귀로 잡는다).
    location /api/voice/ {
        set $backend http://app:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 헬스체크 — 상태만 돌려주고 데이터가 없다. 모니터링이 로그인할 수 없다.
    location = /api/health {
        set $backend http://app:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # 보호자 접수 — 로그인 없이 열려 있는 유일한 쓰기 API.
    #
    # 별도 location 으로 둔 것은 CF 헤더를 넘기지 않기 위해서다. /api/ 는
    # /api/reset 판별용으로 그 헤더를 넘기는데, 여기는 그럴 이유가 없다.
    #
    # 여기는 로그인 대신 **응답 범위**로 지킨다. GuardianIntakeOut 이 보호자가
    # 적어 보낸 것만 돌려주므로, 아무나 불러도 새로 알게 되는 정보가 없다.
    # 접수 하나를 만드는 쓰기만 가능하고 조회는 없다.
    location = /api/guardian/intakes {
        set $backend http://app:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 보호자 접수 (Next 통합판) — /api/guardian/intakes 와는 다른 API다.
    # 위 exact match 는 /api/guardian/intakes 만 잡으므로, 이걸 안 두면 아래
    # 일반 /api/ 로 떨어져 app:8000(FastAPI) 이 404 를 준다 — 신청이 FastAPI로
    # 잘못 새는 게 아니라 next 의 Route Handler(app/api/guardian/applications)에
    # 아예 닿지 못하는 문제였다.
    location ^~ /api/guardian/applications {
        set $next http://next:3000;
        proxy_pass $next;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $backend http://app:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cloudflare 가 붙인 헤더를 백엔드까지 전달한다 —
        # /api/reset 의 외부 요청 차단이 이 헤더로 판별한다.
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_set_header CF-Ray            $http_cf_ray;
        # STT 는 오래 걸릴 수 있다(모델 최초 적재 포함)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Next.js 관리자 콘솔의 BFF(Route Handler). 브라우저가 Team FastAPI를 직접
    # 부르지 않게 하는 경계라, 기존 /api/ FastAPI 프록시보다 먼저 잡아야 한다.
    # ^~ 는 아래 정적 확장자 정규식이 이 경로의 응답을 가로채지 않게 한다.
    location ^~ /api/v1/ {
        set $next http://next:3000;
        proxy_pass $next;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Next 빌드 자산(/_next/static/**). **^~ 가 없으면 전부 404 다.**
    #
    # nginx 는 정규식 location 을 접두어 location 보다 먼저 고른다. 아래
    # `~* \.(js|css)$` 가 /_next/static/chunks/*.js 를 가로채는데, 그 블록에는
    # proxy_pass 가 없어서 root(/usr/share/nginx/html) 에서 파일을 찾다 404 로
    # 끝난다. `location /` 의 프록시까지 가지도 못한다.
    #
    # ^~ 는 "이 접두어가 이기면 정규식은 보지 마라" 는 뜻이라 그 가로채기를 막는다.
    # 실제 nginx 로 재현해 확인했다 — ^~ 없이는 /_next/static/chunks/x.js 가 404,
    # 붙이면 200 이다. Cloudflare 가 캐시하고 있으면 한동안 안 드러나서 더 위험하다.
    location ^~ /_next/ {
        set $next http://next:3000;
        proxy_pass $next;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger — 프론트 담당자가 연동 기준으로 본다.
    #
    # **여기는 기본 인증을 건다.** API 스키마 전체가 공개되면 공격자에게 지도를
    # 주는 셈인데, 이건 API 가 아니라 문서라 토큰 401 이 붙지 않는다.
    # .env 에 STAFF_USER/STAFF_PASSWORD 가 없으면 인증이 꺼진 채로 열린다.
    location ~ ^/(docs|redoc|openapi\.json) {
        if ($is_guardian_host) { return 404; }
        include /etc/nginx/auth.conf;
        set $backend http://app:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 백엔드의 개발 확인용 UI. 프론트가 / 를 가져갔으므로 여기로 옮겨 살려둔다.
    # 접수 폼·STT·녹음·사후기록이 들어 있어 프론트 완성 전까지 시연·점검에 쓴다.
    #
    # **여기도 기본 인증을 건다.** 내부 도구라 밖에 보일 이유가 없다.
    # (안의 기능은 어차피 토큰이 필요하지만, 화면 자체를 노출할 이유가 없다)
    location /dev {
        if ($is_guardian_host) { return 404; }
        include /etc/nginx/auth.conf;
        set $backend http://app:8000;
        rewrite ^/dev/?(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_set_header CF-Ray            $http_cf_ray;
    }

    # 사회복지사 콘솔. 보호자 웹(/)과 **경로를 나눈 이유는 권한**이다.
    #
    # 이 화면은 **공개**다. 열면 로그인 폼이 뜨고, 그 너머는 토큰이 지킨다.
    # 무차별 대입은 앱 쪽 로그인 시도 제한(계정당 5분내 5회 → 60초 잠금)이 막는다.
    # 화면 자체를 더 가리고 싶으면 Cloudflare Access 를 쓴다(docs/DEPLOY-ACCESS.md).
    #
    # Next 콘솔로 /staff 가 옮겨오면서 정적 SPA 폴백은 더 안 쓴다. next 로 넘긴다.
    location /staff {
        # 보호자 호스트에서는 존재하지 않는 경로로 만든다. 403 이 아니라 404 다 —
        # "여기 뭔가 있는데 막혔다" 를 알려줄 이유가 없다.
        if ($is_guardian_host) { return 404; }
        set $next http://next:3000;
        proxy_pass $next;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 새 콘솔(디자인 목업 반영판). /staff 와 **같은 백엔드를 보는 다른 화면**이다.
    #
    # 경로를 나눈 이유는 본선이다 — 시연이 /staff 로 돌아가고 있어서, 다 만들어
    # 확인하기 전에는 그 화면을 바꾸지 않는다. 확인이 끝나면 /staff 를 여기로
    # 302 하면 되고, 문제가 생기면 이 블록만 지우면 원래대로 돌아간다.
    # 보호자 포털(신청 마법사 + 신청 조회). 보호자용이므로 **guardian 호스트에서
    # 막지 않는다** — /staff·/console 과 반대다. 직원 호스트에서도 열어 두는 것은
    # 복지사가 보호자에게 보여주며 안내할 일이 있어서다.
    location ^~ /portal {
        try_files $uri $uri/ /portal/index.html;
        add_header Cache-Control "no-store" always;
    }

    # ^~ 다. 없으면 /console/console.css 같은 요청이 아래 js·css 정규식으로
    # 새서(정규식이 ^~ 없는 prefix location을 이긴다), 우연히 로컬 정적
    # 파일 이름과 겹칠 때만 살아남는 상태가 된다.
    location ^~ /console {
        if ($is_guardian_host) { return 404; }
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /console/index.html;
    }

    # Next.js 관리자 콘솔. /portal·/staff·/console 은 위의 더 구체적인
    # location이 계속 기존 정적 화면으로 처리한다.
    location / {
        set $next http://next:3000;
        proxy_pass $next;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # js·css 를 7일 캐시하면 안 된다. 빌드 도구가 없어 파일 이름에 해시가
    # 붙지 않으므로, 배포해도 브라우저가 7일 동안 옛 파일을 계속 쓴다.
    # 실제로 /staff 를 고쳐 배포했는데 클릭이 안 되는 일이 있었다 — 서버에는
    # 새 파일이 있는데 브라우저가 옛것을 붙들고 있었다.
    #
    # no-cache 는 '캐시하지 마라'가 아니라 '쓰기 전에 물어봐라'다. ETag 가
    # 같으면 304 로 끝나서 트래픽은 거의 같고, 바뀌면 즉시 반영된다.
    # 나중에 번들러를 붙여 파일명에 해시가 생기면 그때 다시 길게 잡으면 된다.
    # /portal·/console 은 ^~ 라서 여기 안 걸린다(위에서 이미 끝남). 그 둘을
    # 뺀 나머지 js·css — 특히 next의 public/ 자산(예: /guardian/logo.png는
    # 아래 이미지 블록) — 은 로컬에 파일이 없어 이 블록에 proxy_pass가
    # 없으면 그대로 404 로 끝난다. next 로 넘긴다.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
        set $next http://next:3000;
        proxy_pass $next;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 이미지·폰트는 바뀌면 이름을 바꾸는 것이 보통이라 길게 잡아도 된다.
    # /guardian/logo.png, next의 자동 생성 favicon(/icon-*.png) 등이 여기로
    # 온다 — 로컬 정적 루트엔 없으므로 next 로 넘긴다.
    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        set $next http://next:3000;
        proxy_pass $next;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HTML 은 항상 새로 받는다. `location = /index.html` 로는 /staff/index.html
    # 이 걸리지 않아 사회복지사 콘솔만 캐시에 남던 문제도 함께 잡는다.
    #
    # **이 규칙만으로는 부족하다.** 주소가 `.html` 로 끝날 때만 걸리는데,
    # 사람은 `/console/` 처럼 디렉터리로 연다. 그때는 try_files 가 안에서
    # index.html 을 꺼내 줄 뿐 요청 주소는 여전히 `/console/` 이라 이 정규식에
    # 안 걸리고, 브라우저가 기본 휴리스틱으로 HTML 을 캐시한다.
    #
    # 그래서 배포해도 옛 화면이 뜬다 — `up -d --build` 로 컨테이너를 새로
    # 만들었는데도 화면이 그대로라 `down` 까지 하게 된다. 컨테이너 문제가
    # 아니라 브라우저가 옛 HTML 을 붙들고 있는 것이다.
    #
    # 아래 세 곳(prefix location)에 no-store 를 직접 건다. js·css·이미지는
    # 각자 정규식 location 이 먼저 잡으므로 영향받지 않는다(nginx 는 정규식
    # location 을 prefix 보다 먼저 고른다).
    location ~* \.html$ {
        add_header Cache-Control "no-store";
    }
}
