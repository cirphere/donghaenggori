# 프론트엔드 오버레이 — 백엔드와 별도 컨테이너로 띄운다.
#
#   docker compose -f docker-compose.yml -f docker-compose.frontend.yml up -d --build
#   (COMPOSE_FILE 에 넣어두면 -f 없이 docker compose up -d 로 끝난다)
#
# 백엔드(app)와 프론트(frontend)는 서로 다른 컨테이너·다른 주소다.
#   프론트  https://donghaenggori.dohyeongops.com   → frontend:80
#   백엔드  https://api.dohyeongops.com             → app:8000
# 터널에 Public Hostname 을 두 개 만들어 각각 연결한다(docs/FRONTEND.md 참조).
#
# 오리진이 다르므로 브라우저에서 CORS 가 필요하다. 백엔드는 기본이 전부 허용이라
# 그대로 동작하고, 좁히려면 .env 의 CORS_ORIGINS 에 프론트 주소를 넣는다.

services:
  frontend:
    build:
      context: ./frontend
      args:
        # 빌드 산출물 디렉터리 — Vite=dist, CRA=build, Next(export)=out
        BUILD_DIR: ${FRONTEND_BUILD_DIR:-dist}
    image: donghaenggori:frontend
    restart: unless-stopped
    # 기본 인증 자격증명. 비워두면 인증이 꺼지고 기동 로그에 경고가 크게 남는다.
    # 값은 .env 에만 두고 저장소에 넣지 않는다.
    environment:
      STAFF_USER: "${STAFF_USER:-}"
      STAFF_PASSWORD: "${STAFF_PASSWORD:-}"
    env_file:
      - .env
    ports:
      # 로컬 확인용. 터널은 이 포트가 아니라 컨테이너 이름으로 붙는다.
      #
      # 반드시 루프백에만 연다. nginx 가 /api/ 를 app:8000 으로 그대로 넘기므로,
      # 이 포트를 0.0.0.0 에 열면 app 포트를 127.0.0.1 로 좁혀둔 것이 무의미해진다
      # — 같은 공유기의 다른 기기가 3000 번을 거쳐 /api/reset 을 부를 수 있고,
      # 그 요청에는 Cloudflare 헤더가 없어 '외부 차단'을 통과한다(데이터 전체 삭제).
      - "127.0.0.1:3000:80"
    depends_on:
      - app
