# Next.js 관리자 콘솔 오버레이.
#
#   docker compose -f docker-compose.yml -f docker-compose.frontend.yml \
#     -f docker-compose.next.yml up -d --build
#
# frontend(nginx)가 공개 진입점이다. next 는 도커 네트워크에서만 열고 nginx가
# 넘긴다 — / (보호자) · /staff (사회복지사) · /_next/ · /api/v1/ ·
# /api/guardian/applications. 나머지 /api/ 는 기존 FastAPI 가 받고, /portal 과
# /console 은 정적 화면이 그대로 담당한다(Next 가 죽었을 때의 대체 경로다).

services:
  next:
    build:
      # 팀원 저장소(dlghskgmll/donghaengori-ai)를 clone 한 폴더다. 저장소에
      # 담지 않으므로(.gitignore) 배포 전에 clone 되어 있어야 한다.
      # backend/frontend/ 와 이름이 같지만 다른 것이다 — 그쪽은 nginx + 정적 화면.
      # 저장소 루트의 **형제** 디렉터리다. 저장소 안의 frontend/ 는 레거시
      # 정적 화면(nginx)이라 이름만 같고 다른 것이다 — 그쪽을 가리키면 next
      # 이미지가 조용히 정적 화면으로 바뀐다.
      context: ../frontend
    image: donghaenggori:next
    restart: unless-stopped
    environment:
      # 브라우저에는 노출되지 않는 Next Route Handler용 서버 간 주소.
      TEAM_AI_BASE_URL: http://app:8000
      TEAM_AI_TIMEOUT_MS: ${TEAM_AI_TIMEOUT_MS:-30000}
      # 데모에서는 외부 LLM을 켜지 않는다. Team FastAPI만 사용한다.
      AI_PROVIDER: team
      STT_PROVIDER: team
      # 보호자 포털 신청 저장소. memory(기본값)는 개발 전용이라 production에서
      # 막힌다 — team으로 지정해 실제 backend(app:8000)에 저장한다.
      GUARDIAN_PERSISTENCE: team
    depends_on:
      - app
