<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동행고리 — 병원동행 신청</title>
<link rel="stylesheet" href="fonts/pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="guardian">

<header class="topbar">
  <div>
    <strong>동행고리</strong>
    <span class="sub">어르신 병원동행 신청</span>
  </div>
</header>

<main class="single">
  <section class="panel">
    <h2>병원동행을 신청합니다</h2>
    <p class="lead">
      어르신 대신 신청하실 수 있습니다. 남겨주시면 담당 사회복지사가 확인한 뒤
      연락드립니다. 이 화면에서는 <b>일정이 확정되지 않습니다.</b>
    </p>

    <label>신청하시는 분 연락처
      <input id="phone" inputmode="tel" placeholder="010-0000-0000" value="010-9876-5432">
      <span class="help">어르신 번호가 아니라 <b>신청하시는 분</b>의 번호를 적어주세요.</span>
    </label>

    <label>어떤 도움이 필요하신가요
      <textarea id="utterance" rows="4"
        placeholder="예) 어머니가 무릎이 아프셔서 모레 오전에 정형외과 모시고 가야 해요">어머니가 무릎이 아프셔서 모레 오전 10시에 정형외과 모시고 가야 해요</textarea>
    </label>

    <button id="btnSubmit" class="primary wide">신청하기</button>

    <p class="notice">
      급하거나 위급한 상황이면 이 화면을 쓰지 마시고 <b>119</b> 또는 담당자에게
      바로 전화해 주세요.
    </p>
  </section>

  <section class="panel">
    <div id="result" class="empty">신청 내용을 남기고 <b>신청하기</b>를 눌러주세요.</div>
  </section>
</main>

<script type="module" src="guardian.js"></script>
</body>
</html>
