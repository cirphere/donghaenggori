<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동행고리 AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div>
    <strong>동행고리 AI</strong>
    <span class="sub">병원동행 접수 Copilot — AI는 후보·근거까지, 확정은 사람</span>
  </div>
  <div class="status" id="sysStatus">상태 확인 중…</div>
</header>

<!--
  임시 화면이다. 배선을 확인하고 계약을 눈으로 보려고 만든 것이라
  디자인은 최소한만 넣었다. 제대로 만들 때 api.js 는 그대로 쓰고
  이 파일과 style.css 만 갈아끼우면 된다.
-->
<div class="note">
  임시 화면입니다. 응답 계약(<code>card.fields</code>, <code>policy</code>)을 그대로 그려
  백엔드 연결을 확인하는 용도입니다. 실제 UI는 이후 별도로 구현합니다.
</div>

<main>
  <!-- ── 화면 02 접수 입력 ───────────────────────────── -->
  <section class="panel">
    <h2>접수</h2>

    <label>발신번호
      <input id="phone" value="010-1234-5678" placeholder="010-0000-0000">
    </label>

    <label>발화
      <textarea id="utterance" rows="3"
        placeholder="예) 모레 정형외과 가야겄어. 저번에 무릎 봐준 데">모레 정형외과 가야겄어. 저번에 무릎 봐준 데</textarea>
    </label>

    <label>채널
      <select id="channel">
        <option>전화</option>
        <option>앱·웹(보호자)</option>
        <option>직접(기관)</option>
      </select>
    </label>

    <div class="row">
      <button id="btnIntake" class="primary">접수카드 만들기</button>
      <button id="btnRec">● 녹음</button>
      <input type="file" id="audioFile" accept="audio/*" hidden>
      <button id="btnPick">음성 파일</button>
    </div>
    <div class="hint" id="recHint"></div>

    <details class="samples">
      <summary>시연 발화 모음</summary>
      <button class="sample" data-phone="010-1234-5678" data-text="모레 정형외과 가야겄어. 저번에 무릎 봐준 데">단골 → 확인됨</button>
      <button class="sample" data-phone="010-1234-5678" data-text="내일 아니고 모레 오후 2시 반에 가야 해">날짜 자기수정 + 시각</button>
      <button class="sample" data-phone="010-1234-5678" data-text="모레 3시에 정형외과 가야 해">오전·오후 불명 → 되묻기</button>
      <button class="sample" data-phone="010-7777-8888" data-text="내일 그 큰 병원 좀 가야 쓰겄는디">이력 없음 → 확인 필요</button>
      <button class="sample" data-phone="010-9876-5432" data-text="느그 어매 병원 좀 델꼬 가야 쓰겄는디">보호자 대리 전화</button>
      <button class="sample" data-phone="010-0000-0000" data-text="병원 좀 가야 해">미등록 번호</button>
      <button class="sample" data-phone="010-1234-5678" data-text="가슴이 답답하고 숨이 차">긴급 → 접수 중단</button>
      <button class="sample" data-phone="010-1234-5678" data-text="고맙습니다 수고하세요">확신 낮은 긴급 → 확인 요청</button>
    </details>
  </section>

  <!-- ── 화면 03 접수카드 ────────────────────────────── -->
  <section class="panel" id="resultPanel">
    <h2>접수카드</h2>
    <div id="result" class="empty">왼쪽에서 발화를 넣고 <b>접수카드 만들기</b>를 누르세요.</div>
  </section>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
