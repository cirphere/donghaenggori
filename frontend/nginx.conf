# 프론트 정적 서빙 + 백엔드 리버스 프록시
#
# 프론트와 API를 **같은 오리진**으로 묶는다. 이렇게 하면
#   · CORS 가 필요 없다 (같은 출처)
#   · Cloudflare Access 를 이 호스트명 하나에만 걸면 API 까지 함께 보호된다
#     (오리진이 같아 로그인 쿠키가 API 요청에도 자동으로 실린다)
#   · 터널 Public Hostname 이 하나로 끝난다
#
# 백엔드는 별도 컨테이너 그대로다. 라우팅만 여기서 한다.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 음성 업로드가 있으므로 넉넉히. 5분 음성이 수 MB 수준이다.
    client_max_body_size 64m;

    # 도커 내장 DNS. 변수로 넘겨 요청마다 해석하게 한다 —
    # 그러지 않으면 app 컨테이너가 재시작될 때 nginx 가 옛 IP 를 붙들고
    # 502 를 낸다(기동 시 1회만 해석하기 때문).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://app:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cloudflare 가 붙인 헤더를 백엔드까지 전달한다 —
        # /api/reset 의 외부 요청 차단이 이 헤더로 판별한다.
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_set_header CF-Ray            $http_cf_ray;
        # STT 는 오래 걸릴 수 있다(모델 최초 적재 포함)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Swagger — 프론트 담당자가 연동 기준으로 본다
    location ~ ^/(docs|redoc|openapi\.json) {
        set $backend http://app:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 백엔드의 개발 확인용 UI. 프론트가 / 를 가져갔으므로 여기로 옮겨 살려둔다.
    # 접수 폼·STT·녹음·사후기록이 들어 있어 프론트 완성 전까지 시연·점검에 쓴다.
    location /dev {
        set $backend http://app:8000;
        rewrite ^/dev/?(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_set_header CF-Ray            $http_cf_ray;
    }

    # 사회복지사 콘솔. 보호자 웹(/)과 **경로를 나눈 이유는 권한**이다.
    #
    # 백엔드는 아직 요청 본문의 role 을 그대로 믿는다(인증 미구현). 그래서 이
    # 화면에 닿을 수 있는 사람은 접수 확정·사후기록 승인·감사로그 조회를 전부
    # 할 수 있다. 코드로 인증을 만드는 대신, 배포에서 이 경로만 Cloudflare
    # Access 뒤에 둔다 — Zero Trust → Access → Applications 에서 Path 를
    # /staff 로 지정하면 된다(docs/DEPLOY-ACCESS.md).
    #
    # 여기서 따로 잡지 않으면 아래 SPA 폴백이 /staff/* 를 보호자용 index.html
    # 로 넘겨서, 경로 자체가 사라진다.
    location /staff {
        try_files $uri $uri/ /staff/index.html;
    }

    # SPA 라우팅 — 없는 경로는 index.html 로 넘긴다.
    # React Router 등에서 새로고침 시 404 나는 문제를 막는다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # js·css 를 7일 캐시하면 안 된다. 빌드 도구가 없어 파일 이름에 해시가
    # 붙지 않으므로, 배포해도 브라우저가 7일 동안 옛 파일을 계속 쓴다.
    # 실제로 /staff 를 고쳐 배포했는데 클릭이 안 되는 일이 있었다 — 서버에는
    # 새 파일이 있는데 브라우저가 옛것을 붙들고 있었다.
    #
    # no-cache 는 '캐시하지 마라'가 아니라 '쓰기 전에 물어봐라'다. ETag 가
    # 같으면 304 로 끝나서 트래픽은 거의 같고, 바뀌면 즉시 반영된다.
    # 나중에 번들러를 붙여 파일명에 해시가 생기면 그때 다시 길게 잡으면 된다.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # 이미지·폰트는 바뀌면 이름을 바꾸는 것이 보통이라 길게 잡아도 된다
    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # HTML 은 항상 새로 받는다. `location = /index.html` 로는 /staff/index.html
    # 이 걸리지 않아 사회복지사 콘솔만 캐시에 남던 문제도 함께 잡는다.
    location ~* \.html$ {
        add_header Cache-Control "no-store";
    }
}
