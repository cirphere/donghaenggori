server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅 — 없는 경로는 index.html 로 넘긴다.
    # React Router 등을 쓸 때 새로고침하면 404 나는 문제를 막는다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산은 오래 캐시하되 index.html 은 캐시하지 않는다
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
