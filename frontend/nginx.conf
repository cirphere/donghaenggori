# 프론트 정적 서빙 + 백엔드 리버스 프록시
#
# 프론트와 API를 **같은 오리진**으로 묶는다. 이렇게 하면
#   · CORS 가 필요 없다 (같은 출처)
#   · Cloudflare Access 를 이 호스트명 하나에만 걸면 API 까지 함께 보호된다
#     (오리진이 같아 로그인 쿠키가 API 요청에도 자동으로 실린다)
#   · 터널 Public Hostname 이 하나로 끝난다
#
# 백엔드는 별도 컨테이너 그대로다. 라우팅만 여기서 한다.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 음성 업로드가 있으므로 넉넉히. 5분 음성이 수 MB 수준이다.
    client_max_body_size 64m;

    # 도커 내장 DNS. 변수로 넘겨 요청마다 해석하게 한다 —
    # 그러지 않으면 app 컨테이너가 재시작될 때 nginx 가 옛 IP 를 붙들고
    # 502 를 낸다(기동 시 1회만 해석하기 때문).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://app:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cloudflare 가 붙인 헤더를 백엔드까지 전달한다 —
        # /api/reset 의 외부 요청 차단이 이 헤더로 판별한다.
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_set_header CF-Ray            $http_cf_ray;
        # STT 는 오래 걸릴 수 있다(모델 최초 적재 포함)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Swagger — 프론트 담당자가 연동 기준으로 본다
    location ~ ^/(docs|redoc|openapi\.json) {
        set $backend http://app:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 백엔드의 개발 확인용 UI. 프론트가 / 를 가져갔으므로 여기로 옮겨 살려둔다.
    # 접수 폼·STT·녹음·사후기록이 들어 있어 프론트 완성 전까지 시연·점검에 쓴다.
    location /dev {
        set $backend http://app:8000;
        rewrite ^/dev/?(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_set_header CF-Ray            $http_cf_ray;
    }

    # SPA 라우팅 — 없는 경로는 index.html 로 넘긴다.
    # React Router 등에서 새로고침 시 404 나는 문제를 막는다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
