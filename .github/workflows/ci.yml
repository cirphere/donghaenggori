name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # torch·transformers·faster-whisper 는 깔지 않는다.
      # 무거운 패키지는 전부 함수 안에서 지연 import 되고 없으면 폴백하므로,
      # 회귀 테스트는 필수 의존성만으로 돈다(설치 몇 초 vs 수 분).
      - name: 필수 의존성만 설치
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" jinja2 python-multipart python-dotenv httpx

      # 린트는 테스트보다 먼저 — 몇 초면 끝나고, 안 쓰는 import 나 컴프리헨션
      # 변수 어긋남처럼 테스트가 못 잡는 것을 잡는다. 실제로 이 단계를 붙이면서
      # _NOT_A_NAME 의 중복 항목 3개와 raise ... from 누락을 찾았다.
      - name: 린트 (ruff)
        run: |
          pip install ruff
          ruff check .

      # 복지시설은 init_db 가 아니라 loader 가 넣는다. 이걸 빠뜨리면
      # case 10(광주 복지관 조회)이 0건으로 실패한다 — 로컬에서는 예전에
      # 적재해둔 DB가 남아 있어 드러나지 않는 차이다.
      # 키가 없으면 공공 API 는 건너뛰고 저장소에 있는 CSV 만 읽으므로
      # 네트워크 없이 결정적으로 돈다(C-DS03 20건 · C-DS18 13건).
      - name: 복지시설 CSV 적재
        run: python -m donghaenggori.services.loader

      # 학습 모델(425MB)은 저장소에 없다. 없는 상태에서도 통과해야 한다 —
      # 폴백이 실제로 동작하는지까지 함께 검증하는 셈이다.
      - name: 파일3 회귀 테스트
        run: python -m tests.test_file3_cases

      # 전화 웹훅은 실제 통화 없이 검증한다 — 서명 거절과 긴급 전환이 핵심이라
      # 회선 없이도 회귀로 잡아야 한다.
      - name: 전화 연동 웹훅 테스트
        run: python -m tests.test_voice

      # 이름·주소는 못 잡는 것보다 틀리게 잡는 쪽이 나쁘다. '리' 를 주소 꼬리로
      # 두면 "허리 아파서" 가 주소로 잡혔다 — 안 뽑아야 하는 경우까지 묶어둔다.
      - name: 말한 성함·주소 추출 테스트
        run: python -m tests.test_identity_extract

      # 설정 파일은 컨테이너별로 나뉘어 있고 전부 gitignore 라 CI 에는 없다.
      # 예제를 복사해 채운다 — 덤으로 각 .example 이 실제로 쓸 수 있는 파일인지
      # 함께 검증된다(주석 오타로 파싱이 깨지는 것을 여기서 잡는다).
      - name: 설정 파일 준비
        run: |
          for f in .env .env.app .env.frontend .env.tunnel; do
            cp "$f.example" "$f"
          done

      # `KEY=   # 설명` 은 값이 비어 있을 때 docker compose 가 주석을 **값으로**
      # 읽는다. HF_TOKEN 이 '# 모델 다운로드…' 가 되어 HTTP 헤더에서 터졌고,
      # CLAWOPS_GREETING 은 전화 인사말로 그 주석이 그대로 읽혔다.
      # 값이 있으면 잘라내므로 눈으로는 구분이 안 된다 — compose 에게 물어본다.
      - name: 설정 값에 주석이 새지 않는지
        run: |
          docker compose -f docker-compose.yml \
            -f docker-compose.tunnel.yml \
            -f docker-compose.frontend.yml config --format json > /tmp/env.json
          python - <<'PY'
          import json, sys
          bad = []
          for name, svc in json.load(open("/tmp/env.json"))["services"].items():
              for k, v in (svc.get("environment") or {}).items():
                  if isinstance(v, str) and v.lstrip().startswith("#"):
                      bad.append(f"{name}.{k} = {v[:40]!r}")
          if bad:
              sys.exit("주석이 값으로 새어 들어감 (주석을 키 위 줄로 옮길 것):\n  "
                       + "\n  ".join(bad))
          print("설정 값에 주석 없음")
          PY

      - name: compose 파일 문법 검사
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.gpu.yml \
            -f docker-compose.tunnel.yml \
            -f docker-compose.frontend.yml config -q

      # 나눈 의미가 있는지 본다 — app 컨테이너가 콘솔 비밀번호나 터널 토큰을
      # 보면 안 된다. 나중에 누가 편하다고 한 파일로 되돌리면 여기서 걸린다.
      - name: 컨테이너별 비밀 격리 확인
        run: |
          rm -f .env                      # 옛 통합 파일이 없는 상태로 본다
          printf 'STAFF_PASSWORD=LEAK_PW\n'     >> .env.frontend
          printf 'TUNNEL_TOKEN=LEAK_TOKEN\n'    >> .env.tunnel
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.tunnel.yml \
            -f docker-compose.frontend.yml config --format json > /tmp/cfg.json
          python - <<'PY'
          import json, sys
          svc = json.load(open("/tmp/cfg.json"))["services"]
          leaked = [k for k, v in (svc["app"].get("environment") or {}).items()
                    if isinstance(v, str) and v.startswith("LEAK")]
          if leaked:
              sys.exit(f"app 컨테이너가 남의 비밀을 본다: {leaked}")
          print("app 컨테이너는 자기 설정만 본다")
          PY

      - name: Dockerfile 빌드 (CPU 이미지)
        run: docker build -f Dockerfile -t donghaenggori:ci .
